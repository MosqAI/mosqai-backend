name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mosqai
          POSTGRES_PASSWORD: mosqai_ci_password
          POSTGRES_DB: mosqai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mosqai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mosqai:mosqai_ci_password@localhost:5432/mosqai_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm test:e2e
      - run: pnpm build
